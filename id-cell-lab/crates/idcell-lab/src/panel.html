<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID-CELL 仿真面板</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel2: #18202b;
    --line: #223040;
    --text: #e6edf3;
    --dim: #8b9bb0;
    --accent: #4cc2ff;
    --ok: #3ddc97;
    --warn: #ffb454;
    --err: #ff5c7a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 9;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: rgba(11,15,20,.92);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .scenario { color: var(--dim); font-size: 12px; }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .pill {
    padding: 2px 10px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.run { color: var(--ok); border-color: rgba(61,220,151,.4); }
  .pill.pause { color: var(--warn); border-color: rgba(255,180,84,.4); }
  .pill.done { color: var(--accent); border-color: rgba(76,194,255,.4); }
  a.pill { text-decoration: none; }
  a.pill:hover { color: var(--accent); border-color: var(--accent); }
  .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font-size: 12px;
  }
  main { padding: 18px 20px 48px; display: grid; gap: 18px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { color: var(--dim); font-size: 11px; }
  .stat .v { font-family: var(--mono); font-size: 19px; margin-top: 2px; }
  .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  section h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); margin: 0 0 8px; font-weight: 600;
  }
  .devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card.hidden-dev { opacity: .55; }
  .dev-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dev-name { font-size: 14px; font-weight: 600; }
  .did { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .badges { display: flex; gap: 6px; margin: 6px 0 8px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .badge.on { color: var(--ok); border-color: rgba(61,220,151,.35); }
  .badge.off { color: var(--err); border-color: rgba(255,92,122,.35); }
  .sessions { display: grid; gap: 8px; margin-bottom: 8px; }
  .session { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel2); }
  .sess-top { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .sess-top .peer { font-weight: 600; }
  .sess-top .role { color: var(--dim); font-size: 11px; }
  .pipeline { display: flex; gap: 2px; margin-top: 7px; }
  .step { flex: 1; text-align: center; font-size: 9px; letter-spacing: .3px; color: #4b5b70; }
  .step .dot { height: 4px; border-radius: 2px; background: #27313d; margin-bottom: 3px; }
  .step.done .dot { background: var(--ok); }
  .step.cur .dot { background: var(--accent); box-shadow: 0 0 8px rgba(76,194,255,.8); }
  .step.done, .step.cur { color: var(--dim); }
  .sess-meta { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 6px; display: flex; gap: 10px; }
  .sess-meta .stale { color: var(--warn); }
  .sess-meta .err { color: var(--err); }
  .values { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .values td { padding: 3px 4px; border-top: 1px solid var(--line); }
  .values td.num { font-family: var(--mono); text-align: right; }
  .values td.age { color: var(--dim); text-align: right; font-family: var(--mono); }
  .values tr.stale td { color: var(--warn); }
  .values td.ctl { text-align: right; white-space: nowrap; }
  .ctl-btn { padding: 1px 7px; font-size: 10.5px; border-radius: 5px; }
  .ctl-btn.on { color: var(--ok); border-color: rgba(61,220,151,.5); }
  .ctl-group { display: inline-flex; gap: 3px; }
  .dev-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .dev-actions button { padding: 3px 8px; font-size: 11px; }
  .power-btn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; padding: 3px 9px 3px 6px; border-radius: 999px;
    border: 1px solid var(--line); background: #101720; color: var(--dim);
  }
  .power-btn .sw {
    width: 24px; height: 13px; border-radius: 999px; background: #2a3646;
    position: relative; flex: none;
  }
  .power-btn .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px;
    border-radius: 50%; background: #8b9bb0;
  }
  .power-btn.on { color: var(--ok); border-color: rgba(61,220,151,.38); }
  .power-btn.on .sw { background: rgba(61,220,151,.25); }
  .power-btn.on .sw::after { left: 13px; background: var(--ok); }
  .power-btn.off {
    color: var(--err); border-color: rgba(255,92,122,.5); background: rgba(255,92,122,.08);
  }
  .power-btn.off .sw { background: rgba(255,92,122,.22); }
  .power-btn.off .sw::after { left: 2px; background: var(--err); }
  .links { display: grid; gap: 8px; }
  .link {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  .link .name { font-family: var(--mono); font-size: 12px; }
  .link .meta { color: var(--dim); font-size: 11px; }
  .link.down { border-color: rgba(255,92,122,.45); }
  .trace {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    height: 560px; overflow: auto; padding: 6px 0; font-family: var(--mono); font-size: 11px;
  }
  .tline { display: flex; gap: 8px; padding: 2px 10px; white-space: nowrap; }
  .tline:hover { background: var(--panel2); }
  .tline .t { color: #52627a; width: 62px; text-align: right; }
  .tline .k { width: 40px; color: var(--dim); }
  .tline .f { color: var(--accent); }
  .tline .ty { color: var(--warn); }
  .tline.fault .d, .tline.error .d { color: var(--err); }
  .tline .d { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--dim); padding: 12px; font-size: 12px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .chart .title { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-bottom: 4px; }
  .chart canvas { width: 100%; height: 62px; display: block; }
  .asserts { display: grid; gap: 6px; }
  .assert-item {
    display: flex; gap: 10px; align-items: baseline;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px;
  }
  .assert-item.pass { border-left-color: var(--ok); }
  .assert-item.fail { border-left-color: var(--err); }
  .assert-item .tag { font-family: var(--mono); font-size: 10px; color: var(--dim); min-width: 38px; }
  .assert-item.pass .tag { color: var(--ok); }
  .assert-item.fail .tag { color: var(--err); }
  .assert-item .detail { color: var(--dim); font-size: 11px; }
  .frames { max-height: 300px; overflow: auto; }
  .frame-row { font-family: var(--mono); font-size: 11px; padding: 3px 10px; cursor: pointer; display: flex; gap: 8px; white-space: nowrap; }
  .frame-row:hover { background: var(--panel2); }
  .frame-row .t { color: #52627a; width: 56px; text-align: right; }
  .frame-row .ty { color: var(--warn); width: 78px; }
  .frame-row .ar { color: var(--accent); width: 210px; overflow: hidden; text-overflow: ellipsis; }
  .frame-row .ln { color: var(--dim); width: 40px; text-align: right; }
  .frame-detail {
    background: #0a1018; border: 1px solid var(--line); border-radius: 6px;
    margin: 0 10px 8px; padding: 8px 10px; font-family: var(--mono); font-size: 10.5px;
    color: #9fb2c9; white-space: pre-wrap; word-break: break-all;
  }
  .frame-detail b { color: var(--accent); font-weight: 500; }
  footer { color: #44536b; font-size: 11px; padding: 0 20px 24px; }
</style>
</head>
<body>
<header>
  <h1>ID-CELL <span>仿真面板</span></h1>
  <div class="scenario" id="scenario">—</div>
  <div class="clock" id="clock">0.0s / 0.0s</div>
  <span class="pill" id="status">连接中</span>
  <a class="pill" href="/editor">可视化拓扑</a>
  <div class="spacer"></div>
  <label style="color:var(--dim);font-size:12px">倍速
    <select id="speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="5">5×</option>
      <option value="10">10×</option>
    </select>
  </label>
  <button id="btn-pause">暂停</button>
  <button id="btn-step">步进</button>
  <button id="btn-reset">重置</button>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="charts">
    <div class="chart">
      <div class="title"><span>时延趋势（p50 / p95）</span><span id="lat-now">—</span></div>
      <canvas id="chart-lat" width="640" height="62"></canvas>
    </div>
    <div class="chart">
      <div class="title"><span>发送帧速率（帧/秒）</span><span id="rate-now">—</span></div>
      <canvas id="chart-rate" width="640" height="62"></canvas>
    </div>
  </div>

  <section>
    <h2>断言预览（运行中为实时值，结束为准）</h2>
    <div class="asserts" id="asserts"><div class="empty">等待数据…</div></div>
  </section>

  <div class="cols">
    <section>
      <h2>虚拟设备与六段管道</h2>
      <div class="devices" id="devices"><div class="empty">等待数据…</div></div>

      <section style="margin-top:18px">
        <h2>虚拟链路</h2>
        <div class="links" id="links"><div class="empty">等待数据…</div></div>
      </section>
    </section>

    <section>
      <h2>帧流 / 事件时间线</h2>
      <div class="trace" id="trace"><div class="empty">等待数据…</div></div>
      <section style="margin-top:18px">
        <h2>帧详情（点击展开十六进制与 TLV）</h2>
        <div class="frames" id="frames"><div class="empty">等待数据…</div></div>
      </section>
      <section style="margin-top:18px">
        <h2>介质传播（谁在介质上发了什么、谁听得到）</h2>
        <div class="frames" id="medium"><div class="empty">等待数据…</div></div>
      </section>
    </section>
  </div>
</main>
<footer>帧格式按 v0.12 实现：SYNC A5A5 · 36B 定长头 · CRC16/CCITT-FALSE · 可选 HMAC-SHA256(16B)。所有数据来自真实帧编解码路径。</footer>

<script>
const STAGE_SEG = {
  idle: 0, hello: 1, matched: 2, negotiating: 3, authenticating: 4,
  authed: 4, binding: 5, binding_prepared: 5, active: 6, stale: 6,
  failed: -1, closed: 0
};
const STAGE_LABEL = ["DISC","HELLO","MATCH","NEG","AUTH","BIND"];
const PROFILE_LABEL = {
  sensor: "传感器", actuator: "执行器", controller: "控制器",
  gateway: "网关", monitor: "监视器", device: "设备", node: "节点"
};
let state = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMs(ms) { return (ms / 1000).toFixed(1) + "s"; }

function render(data) {
  state = data;
  const m = data.metrics;
  document.getElementById("scenario").textContent = data.scenario || "—";
  document.getElementById("clock").textContent =
    fmtMs(data.now_ms) + " / " + fmtMs(data.duration_ms);

  const st = document.getElementById("status");
  if (data.now_ms >= data.duration_ms) {
    st.textContent = "已完成"; st.className = "pill done";
  } else if (data.paused) {
    st.textContent = "已暂停"; st.className = "pill pause";
  } else {
    st.textContent = "运行中"; st.className = "pill run";
  }

  const sum = k => data.devices.reduce((a, d) => a + (d.counters[k] || 0), 0);
  const stats = [
    ["帧发送", m.frames_tx], ["帧接收", m.frames_rx],
    ["丢包", m.drops], ["重复", m.duplicated],
    ["CRC 错误", m.crc_errors], ["平均时延", (m.avg_latency_ms ?? 0).toFixed(2) + "ms"],
    ["P95 时延", (m.p95_latency_ms ?? 0).toFixed(1) + "ms"],
    ["抖动 σ", (m.jitter_ms ?? 0).toFixed(2) + "ms"],
    ["吞吐", (m.throughput_kbps ?? 0).toFixed(2) + " kbps"],
    ["绑定成功", sum("binds_ok")], ["绑定失败", sum("binds_fail")],
    ["重连复用", sum("resumes_ok")], ["组播完成", sum("group_ok")], ["组播缺席", sum("group_missing")],
    ["描述重组", sum("desc_reassemble_ok")], ["链路重传", m.link_retx ?? 0], ["入网", sum("provision_ok")],
    ["命令完成", sum("done_rx")], ["命令失败", sum("done_errors")],
    ["配置拒绝", sum("config_rejects")], ["过期事件", sum("stale_events")], ["写拒绝", sum("writes_rejected")],
    ["查询", sum("queries_sent")], ["应答", sum("replies_rx")],
    ["总线仲裁胜/负", `${m.bus_arb_won ?? 0}/${m.bus_arb_lost ?? 0}`],
    ["总线等待", `${m.bus_wait_ms ?? 0}ms`],
    ["半双工转向", m.bus_turnarounds ?? 0], ["自听回显", m.bus_echoes ?? 0],
    ["介质传播", m.medium_count ?? 0]
  ];
  document.getElementById("stats").innerHTML = stats.map(([k, v]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

  renderDevices(data);
  renderLinks(data);
  renderTrace(data);
  renderFrames(data);
  renderMedium(data);
  renderAssertions(data);
  recordHistory(data);
  drawCharts();
}

function renderAssertions(data) {
  const box = document.getElementById("asserts");
  const list = data.assertions || [];
  if (list.length === 0) { box.innerHTML = `<div class="empty">该场景未定义断言</div>`; return; }
  box.innerHTML = list.map(a => `
    <div class="assert-item ${a.passed ? "pass" : "fail"}">
      <span class="tag">${a.passed ? "PASS" : "FAIL"}</span>
      <span>${esc(a.description)}</span>
      <span class="spacer"></span>
      <span class="detail">${esc(a.detail)}</span>
    </div>`).join("");
}

const TYPE_NAMES = {1:"DISCOVER",2:"HELLO",3:"MATCH",4:"NEGOTIATE",5:"RENEGOTIATE",6:"AUTH",7:"BIND",8:"READ",9:"WRITE",10:"SUBSCRIBE",11:"UNSUB",12:"EVENT",13:"CMD",14:"ACK",15:"DONE",16:"LEASE",17:"PREEMPT",18:"GROUP",19:"HEARTBEAT",20:"OFFLINE",21:"STALE",22:"CONFIG",23:"PROVISION",24:"ERROR",25:"RT_DATA"};
const openFrames = new Set();

function byteHex(b, start, n) {
  let s = "";
  for (let i = start; i < start + n && i < b.length; i++) s += b[i].toString(16).padStart(2, "0").toUpperCase();
  return s;
}

function decodeFrame(hex) {
  const b = [];
  for (let i = 0; i + 1 < hex.length; i += 2) b.push(parseInt(hex.slice(i, i + 2), 16));
  if (b.length < 40) return "帧过短，无法解析";
  const u16 = o => (b[o] << 8) | b[o + 1];
  const ts = b.slice(30, 36).reduce((a, v) => a * 256 + v, 0);
  const lines = [];
  lines.push(`头部  SYNC=A5A5  VER=0x${byteHex(b,2,1)}  PROF=${b[3]}  FLAGS=0x${byteHex(b,4,1)}  TYPE=${TYPE_NAMES[b[5]] || b[5]}  SEQ=${u16(6)}  TXN=${u16(8)}  LEN=${u16(10)}`);
  lines.push(`路由  SRC=${byteHex(b,12,8)}  DST=${byteHex(b,20,8)}  GROUP=${u16(28)}  TS=${ts}`);
  const len = u16(10);
  let off = 36;
  const end = Math.min(36 + len, b.length);
  const tlvs = [];
  while (off + 6 <= end) {
    const idx = u16(off), sub = b[off + 2], type = b[off + 3], tl = u16(off + 4);
    const val = byteHex(b, off + 6, tl);
    tlvs.push(`  TLV  TYPE=0x${type.toString(16).padStart(2,"0")}  IDX=${idx}  SUB=${sub}  LEN=${tl}  VAL=${val}`);
    off += 6 + tl;
  }
  lines.push(tlvs.length ? tlvs.join("\n") : "  （无 TLV 载荷）");
  let tail = "";
  if (b.length >= 36 + len + 6) {
    tail = `  CRC=${byteHex(b, 36+len, 2)}  TRAILER=${byteHex(b, 36+len+2, 2)}`;
  }
  lines.push(tail);
  lines.push("HEX  " + hex);
  return lines.join("\n");
}

function renderFrames(data) {
  const box = document.getElementById("frames");
  const rows = data.frames || [];
  if (rows.length === 0) { box.innerHTML = `<div class="empty">暂无帧</div>`; return; }
  const key = f => `${f.t}-${f.seq}-${f.from}`;
  box.innerHTML = rows.slice().reverse().map(f => {
    const k = key(f);
    return `<div class="frame-row" data-key="${k}" data-hex="${f.hex}">
        <span class="t">${f.t}</span>
        <span class="ty">${esc(f.type)}</span>
        <span class="ar">${esc(f.from)} → ${esc(f.to)}</span>
        <span class="ln">${f.len}B</span>
      </div>` + (openFrames.has(k) ? `<div class="frame-detail">${esc(decodeFrame(f.hex))}</div>` : "");
  }).join("");
  box.querySelectorAll(".frame-row").forEach(row => {
    row.onclick = () => {
      const k = row.dataset.key;
      openFrames.has(k) ? openFrames.delete(k) : openFrames.add(k);
      if (state) renderFrames(state);
    };
  });
}

const hist = { t: [], p50: [], p95: [], rate: [] };
let lastFrames = 0, lastT = 0;

function recordHistory(data) {
  const m = data.metrics;
  if (data.now_ms <= lastT) return;
  const dt = data.now_ms - lastT;
  const rate = lastT === 0 ? 0 : (m.frames_tx - lastFrames) * 1000 / dt;
  lastFrames = m.frames_tx;
  lastT = data.now_ms;
  hist.t.push(data.now_ms);
  hist.p50.push(m.p50_latency_ms || 0);
  hist.p95.push(m.p95_latency_ms || 0);
  hist.rate.push(rate);
  for (const k of Object.keys(hist)) {
    if (hist[k].length > 150) hist[k].shift();
  }
  document.getElementById("lat-now").textContent =
    `p50 ${(m.p50_latency_ms || 0).toFixed(1)} / p95 ${(m.p95_latency_ms || 0).toFixed(1)} ms`;
  document.getElementById("rate-now").textContent = `${rate.toFixed(1)} 帧/秒`;
}

function sparkline(canvas, series, unitOk) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#223040";
  ctx.beginPath();
  ctx.moveTo(0, h - 1); ctx.lineTo(w, h - 1);
  ctx.stroke();
  let max = 1;
  for (const s of series) for (const v of s.values) max = Math.max(max, v);
  for (const s of series) {
    if (s.values.length < 2) continue;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const n = s.values.length;
    s.values.forEach((v, i) => {
      const x = (i / (n - 1)) * (w - 2) + 1;
      const y = h - 2 - (v / max) * (h - 8);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
}

function drawCharts() {
  sparkline(document.getElementById("chart-lat"), [
    { color: "#4cc2ff", values: hist.p50 },
    { color: "#ffb454", values: hist.p95 }
  ]);
  sparkline(document.getElementById("chart-rate"), [

function pipelineHtml(stage) {
  const seg = STAGE_SEG[stage] ?? 0;
  return `<div class="pipeline">` + STAGE_LABEL.map((label, i) => {
    let cls = "step";
    if (seg < 0) cls += "";
    else if (i < seg) cls += " done";
    else if (i === seg) cls += " cur";
    return `<div class="${cls}"><div class="dot"></div>${label}</div>`;
  }).join("") + `</div>`;
}

function renderDevices(data) {
  const box = document.getElementById("devices");
  box.innerHTML = data.devices.map((d, di) => {
    const awake = d.awake ? `<span class="badge on">醒</span>` : `<span class="badge off">休眠</span>`;
    const rx = d.rx_on ? `<span class="badge on">RX 开</span>` : `<span class="badge off">RX 关</span>`;
    const pub = d.publishing ? `<span class="badge on">发布中</span>` : `<span class="badge off">停发</span>`;
    const presence = `<span class="badge">presence ${d.presence}</span>`;
    const prof = `<span class="badge${d.prof === 1 ? " on" : ""}">${d.prof === 1 ? "RT" : "STD"}</span>`;
    const power = `<span class="badge ${d.powered ? "on" : "off"}">${d.powered ? "上电" : "断电"}</span>`;
    const owner = d.owner_token ? `<span class="badge">owner 0x${d.owner_token.toString(16)}</span>` : "";

    const sessions = d.sessions.length === 0
      ? `<div class="sess-meta">暂无会话（等待发现）</div>`
      : d.sessions.map(s => `
        <div class="session">
          <div class="sess-top">
            <span class="peer">${esc(s.peer)}</span>
            <span class="role">${esc(s.role)}</span>
            <span class="spacer"></span>
            <span class="role">${esc(s.stage)}</span>
          </div>
          ${pipelineHtml(s.stage)}
          <div class="sess-meta">
            <span>T_pub ${s.t_pub_ms}ms</span>
            ${s.stale ? `<span class="stale">已过期</span>` : ""}
            ${s.error ? `<span class="err">${esc(s.error)}</span>` : ""}
          </div>
        </div>`).join("");

    const queries = (d.queries || []).length === 0 ? "" : `
      <div class="sess-meta">查询会话</div>
      ${d.queries.map(q => `
        <div class="session">
          <div class="sess-top">
            <span class="peer">Q${q.id} ${esc(q.selector)}</span>
            <span class="role">${esc(q.mode)}</span>
            <span class="spacer"></span>
            <span class="role">${q.done ? "完成" : "进行中"}</span>
          </div>
          <div class="sess-meta">
            <span>应答 ${q.replies.length}${q.expected ? " / " + q.expected : ""}</span>
            <span>${q.elapsed_ms}ms</span>
          </div>
        </div>`).join("")}`;

    const values = d.values.length === 0 ? "" : `
      <table class="values">
        ${d.values.map(v => `
          <tr class="${v.stale ? "stale" : ""}">
            <td>${v.index}/${v.sub}</td>
            <td>${esc(v.label)}</td>
            <td class="num">${valueText(v)}</td>
            <td class="age">${v.age_ms}ms</td>
            <td class="ctl">${controlHtml(d.name, v)}</td>
          </tr>`).join("")}
      </table>`;

    return `<div class="card">
      <div class="dev-head">
        <span class="dev-name">${esc(d.name)}</span>
        <span class="did">${esc(d.did)}</span>
        <button class="power-btn ${d.powered ? "on" : "off"}" data-fault='{"kind":"${d.powered ? "power_off" : "power_on"}","device":"${esc(d.name)}"}' title="${d.powered ? "点击断电" : "点击上电"}">
          <span class="sw"></span><span>${d.powered ? "运行" : "断电"}</span>
        </button>
      </div>
      <div class="badges">${presence}${power}${prof}${awake}${rx}${pub}${owner}
        ${d.relay ? '<span class="badge">网关中继</span>' : ''}
        <span class="badge">${PROFILE_LABEL[d.profile] || "设备"}${d.rules ? " · " + d.rules + " 规则" : ""}</span>
        <span class="badge">caps ${d.caps}</span>
        <span class="badge">reqs ${d.reqs}</span>
        <span class="badge">tx/rx ${d.counters.tx}/${d.counters.rx}</span>
      </div>
      <div class="sessions">${sessions}</div>
      ${queries}
      ${values}
      <div class="dev-actions">
        <button data-fault='{"kind":"${d.awake ? "sleep" : "wake"}","device":"${esc(d.name)}"}'>${d.awake ? "休眠" : "唤醒"}</button>
        <button data-fault='{"kind":"${d.publishing ? "stop_publish" : "resume_publish"}","device":"${esc(d.name)}"}'>${d.publishing ? "停止发布" : "恢复发布"}</button>
        <button data-fault='{"kind":"${d.rx_on ? "rx_off" : "rx_on"}","device":"${esc(d.name)}"}'>${d.rx_on ? "关接收机" : "开接收机"}</button>
        <button data-query="${esc(d.name)}">查询全部</button>
      </div>
    </div>`;
  }).join("");

  box.querySelectorAll("button[data-fault]").forEach(btn => {
    btn.onclick = () => postFault(JSON.parse(btn.dataset.fault));
  });
  box.querySelectorAll("button[data-query]").forEach(btn => {
    btn.onclick = () => postQuery(btn.dataset.query);
  });
  box.querySelectorAll("button[data-write]").forEach(btn => {
    btn.onclick = () => postWrite(JSON.parse(btn.dataset.write));
  });
}

function valueText(v) {
  if (v.dtype === "bool") return v.value !== 0 ? "开" : "关";
  return typeof v.value === "number" ? v.value.toFixed(3) : "—";
}

/// 可写点渲染成开关或加减按钮；只读点不显示控件。
function controlHtml(device, v) {
  if (v.dir !== 2 && v.dir !== 3) return "";
  const attr = o => esc(JSON.stringify(o));
  const base = { device, index: v.index, sub: v.sub };
  if (v.dtype === "bool") {
    const on = v.value !== 0;
    return `<button class="ctl-btn ${on ? "on" : ""}" data-write='${attr({ ...base, value: on ? 0 : 1, intent: on ? "关闭" : "打开" })}'>${on ? "关" : "开"}</button>`;
  }
  const lo = Number.isFinite(v.lo) ? v.lo : -1e9;
  const hi = Number.isFinite(v.hi) ? v.hi : 1e9;
  const step = hi > lo && hi - lo < 1e8 ? Math.max(0.001, Math.round((hi - lo) / 100 * 1000) / 1000) : 1;
  const down = +Math.max(lo, v.value - step).toFixed(3);
  const up = +Math.min(hi, v.value + step).toFixed(3);
  return `<span class="ctl-group">
    <button class="ctl-btn" data-write='${attr({ ...base, value: down, intent: "下调" })}'>−</button>
    <button class="ctl-btn" data-write='${attr({ ...base, value: up, intent: "上调" })}'>+</button>
  </span>`;
}

function renderLinks(data) {
  const box = document.getElementById("links");
  if (data.links.length === 0) { box.innerHTML = `<div class="empty">无显式链路（走默认链路画像）</div>`; return; }
  box.innerHTML = data.links.map(l => `
    <div class="link ${l.partitioned ? "down" : ""}">
      <span class="name">${esc(l.a)} ⇄ ${esc(l.b)}</span>
      <span class="meta">${esc(l.media)} / ${esc(l.topology)} · 时延 ${l.delay_ms}ms · 丢包 ${(l.loss_ppm / 10000).toFixed(2)}% · ↑${l.uplink_kbps || "∞"}/↓${l.downlink_kbps || "∞"} kbps</span>
      <span class="meta">帧 ${l.frames} · 丢弃 ${l.dropped}</span>
      ${l.partitioned ? `<span class="badge off">已隔离</span>` : ""}
      <span class="spacer"></span>
      <button class="danger" data-link='${esc(JSON.stringify({kind: l.partitioned ? "heal" : "partition", a: l.a, b: l.b}))}'>
        ${l.partitioned ? "恢复链路" : "断开链路"}
      </button>
    </div>`).join("");
  box.querySelectorAll("button[data-link]").forEach(btn => {
    btn.onclick = () => postFault(JSON.parse(btn.dataset.link));
  });
}

function renderTrace(data) {
  const box = document.getElementById("trace");
  const rows = data.trace.slice().reverse();
  if (rows.length === 0) { box.innerHTML = `<div class="empty">暂无事件</div>`; return; }
  const stick = box.scrollTop <= 4;
  box.innerHTML = rows.map(t => `
    <div class="tline ${esc(t.kind)}">
      <span class="t">${t.t}</span>
      <span class="k">${esc(t.kind)}</span>
      <span class="f">${esc(t.from || "")}${t.to ? "→" + esc(t.to) : ""}</span>
      <span class="ty">${esc(t.type || "")}</span>
      <span class="d">${esc(t.detail || "")}</span>
    </div>`).join("");
  if (stick) box.scrollTop = 0;
}

function renderMedium(data) {
  const box = document.getElementById("medium");
  const rows = (data.medium || []).slice().reverse();
  if (rows.length === 0) { box.innerHTML = `<div class="empty">暂无介质传播</div>`; return; }
  box.innerHTML = rows.map(x => `
    <div class="tline">
      <span class="t">${x.t}</span>
      <span class="k">${x.bus ? "总线" : "链路"}</span>
      <span class="ty">${esc(x.media)} · ${esc(x.from)}→${esc(x.to)}</span>
      <span class="d">${esc(x.type)} #${x.seq} · ${x.len}B · 等待 ${x.wait_ms}ms · 占用 ${x.tx_ms}ms${x.arb ? " · 仲裁 0x" + Number(x.arb).toString(16).toUpperCase() : ""} · 听到: ${esc(x.heard)}</span>
    </div>`).join("");
}

function postFault(obj) {
  fetch("/api/fault", { method: "POST", body: JSON.stringify(obj) })
    .then(r => r.json()).then(j => { if (!j.ok) console.warn(j.msg); });
}

function postQuery(device, selector = "*", mode = "all") {
  fetch("/api/query", { method: "POST", body: JSON.stringify({ device, selector, mode }) })
    .then(r => r.json()).then(j => { if (!j.ok) alert(j.msg); });
}

function postWrite(obj) {
  fetch("/api/write", { method: "POST", body: JSON.stringify(obj) })
    .then(r => r.json()).then(j => { if (!j.ok) alert(j.msg); });
}

function control(cmd, extra = {}) {
  fetch("/api/control", { method: "POST", body: JSON.stringify({ cmd, ...extra }) })
    .then(r => r.json()).then(j => { if (!j.ok) alert(j.msg); });
}

document.getElementById("btn-pause").onclick = () => control("toggle");
document.getElementById("btn-step").onclick = () => control("step");
document.getElementById("btn-reset").onclick = () => {
  document.getElementById("speed").value = "1";
  control("reset"); control("speed", { value: 1 });
};
document.getElementById("speed").onchange = e => {
  control("speed", { value: parseFloat(e.target.value) });
};

function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = ev => {
    try { render(JSON.parse(ev.data)); }
    catch (e) { console.error(e); }
  };
  es.onerror = () => {
    document.getElementById("status").textContent = "重连中";
    document.getElementById("status").className = "pill pause";
  };
}
connect();
</script>
